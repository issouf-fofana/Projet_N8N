<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable – 404</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; }
        .card-error { background: #fff; border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,.10); padding: 60px 50px; text-align: center; max-width: 520px; width: 100%; }
        .error-code { font-size: 7rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, #1e3a8a, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .error-icon { font-size: 4rem; color: #93c5fd; margin-bottom: 12px; }
        .error-title { font-size: 1.4rem; font-weight: 700; color: #1e293b; }
        .error-desc { color: #64748b; margin: 12px 0 32px; }
        .btn-home { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; border: none; border-radius: 10px; padding: 12px 30px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: opacity .2s; }
        .btn-home:hover { opacity: .88; color: #fff; }
        .btn-back { border-radius: 10px; padding: 12px 24px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card-error">
        <div class="error-icon"><i class="bi bi-signpost-split"></i></div>
        <div class="error-code">404</div>
        <div class="error-title mt-3">Page introuvable</div>
        <p class="error-desc">
            La page que vous recherchez n'existe pas ou a été déplacée.<br>
            Vérifiez l'URL ou retournez à l'accueil.
        </p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="/" class="btn-home"><i class="bi bi-house-fill"></i> Retour à l'accueil</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-back"><i class="bi bi-arrow-left"></i> Page précédente</a>
        </div>
    </div>
</body>
</html>
