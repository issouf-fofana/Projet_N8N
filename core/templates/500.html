<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur – 500</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #fff5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; }
        .card-error { background: #fff; border-radius: 20px; box-shadow: 0 8px 40px rgba(220,38,38,.10); padding: 60px 50px; text-align: center; max-width: 520px; width: 100%; }
        .error-code { font-size: 7rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, #dc2626, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .error-icon { font-size: 4rem; color: #fca5a5; margin-bottom: 12px; }
        .error-title { font-size: 1.4rem; font-weight: 700; color: #1e293b; }
        .error-desc { color: #64748b; margin: 12px 0 32px; }
        .btn-home { background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fff; border: none; border-radius: 10px; padding: 12px 30px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: opacity .2s; }
        .btn-home:hover { opacity: .88; color: #fff; }
        .btn-back { border-radius: 10px; padding: 12px 24px; font-weight: 500; }
        .badge-info { background: #fee2e2; color: #991b1b; border-radius: 8px; padding: 10px 18px; font-size: .85rem; display: inline-block; margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="card-error">
        <div class="error-icon"><i class="bi bi-x-octagon-fill"></i></div>
        <div class="error-code">500</div>
        <div class="error-title mt-3">Erreur serveur</div>
        <p class="error-desc">
            Une erreur interne s'est produite. L'équipe technique a été notifiée.<br>
            Réessayez dans quelques instants.
        </p>
        <div class="badge-info">
            <i class="bi bi-clock"></i> Si le problème persiste, contactez l'administrateur.
        </div>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="/" class="btn-home"><i class="bi bi-house-fill"></i> Retour à l'accueil</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-back"><i class="bi bi-arrow-left"></i> Page précédente</a>
        </div>
    </div>
</body>
</html>
