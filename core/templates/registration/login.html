{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Vérification Commandes</title>
    <link rel="icon" type="image/png" href="{% static 'core/favicon.png' %}">
    <link rel="shortcut icon" href="{% static 'core/favicon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary:        #6b4c35;
            --primary-hover:  #54392a;
            --primary-light:  rgba(107,76,53,.12);
            --text-main:      #1c1917;
            --text-muted:     #78716c;
            --border:         #e7e5e4;
            --bg-field:       #fafaf9;
            --bg-page:        #f5f5f4;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-page);
            overflow: hidden;
        }

        /* ── Carte principale ── */
        .card {
            display: flex;
            width: calc(100vw - 64px);
            height: calc(100vh - 64px);
            max-width: 1200px;
            max-height: 780px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(28,25,23,.18);
        }

        /* ── Panneau gauche image ── */
        .card-left {
            flex: 1;
            background-image: url("{% static 'core/image_login.jpg' %}");
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 48px 44px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* overlay sombre léger pour lisibilité du logo */
        .card-left::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, rgba(28,25,23,.55) 0%, rgba(28,25,23,.2) 100%);
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative; z-index: 1;
        }
        .brand-icon {
            width: 40px; height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }
        .brand-name {
            font-size: .95rem;
            font-weight: 700;
            letter-spacing: -.01em;
            color: #fafaf9;
        }


        /* ── Panneau droit : formulaire ── */
        .card-right {
            flex: 0 0 440px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 56px 52px;
        }

        .form-inner { width: 100%; max-width: 340px; }

        .login-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -.02em;
            margin-bottom: 6px;
        }
        .login-sub {
            font-size: .83rem;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .field-group { margin-bottom: 18px; }

        .login-label {
            display: block;
            font-size: .72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-muted);
            margin-bottom: 7px;
        }

        .input-wrap { position: relative; }

        .input-icon {
            position: absolute;
            left: 13px; top: 50%;
            transform: translateY(-50%);
            color: #a8a29e;
            font-size: .85rem;
            pointer-events: none;
        }

        .toggle-pwd {
            position: absolute;
            right: 11px; top: 50%;
            transform: translateY(-50%);
            color: #a8a29e;
            cursor: pointer;
            font-size: .85rem;
            background: none; border: none; padding: 0;
            transition: color .15s;
        }
        .toggle-pwd:hover { color: var(--primary); }

        .login-field {
            width: 100%;
            padding: 11px 38px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: .85rem;
            color: var(--text-main);
            background: var(--bg-field);
            outline: none;
            transition: border-color .2s, box-shadow .2s, background .15s;
        }
        .login-field:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .login-field::placeholder { color: #c8c4c0; }

        .btn-login {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-size: .85rem;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 8px;
            transition: background .2s, transform .15s, box-shadow .2s;
        }
        .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(107,76,53,.28);
        }
        .btn-login:active { transform: translateY(0); }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: 10px;
            padding: 9px 13px;
            font-size: .78rem;
            margin-bottom: 18px;
            display: flex; align-items: center; gap: 7px;
        }
        .alert-info {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            border-radius: 10px;
            padding: 9px 13px;
            font-size: .78rem;
            margin-bottom: 18px;
            display: flex; align-items: center; gap: 7px;
        }

        /* responsive */
        @media (max-width: 720px) {
            .card { width: 100vw; height: 100vh; border-radius: 0; max-height: none; }
            .card-left { display: none; }
            .card-right { flex: 1; padding: 40px 28px; }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- Gauche : branding sombre -->
        <div class="card-left">
            <div class="brand">
                <div class="brand-icon">
                    <img src="{% static 'core/favicon.png' %}" alt="Logo" style="height:24px;width:24px;object-fit:contain;filter:brightness(0) invert(1);" onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'bi bi-box-seam\' style=\'color:#fff;font-size:1rem;\'></i>'">
                </div>
                <span class="brand-name">Vérification Commandes</span>
            </div>

        </div>

        <!-- Droite : formulaire -->
        <div class="card-right">
            <div class="form-inner">

                <div class="login-title">Bienvenue</div>
                <div class="login-sub">Connectez-vous à votre espace</div>

                {% if form.errors %}
                <div class="alert-error">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    Identifiants incorrects. Veuillez réessayer.
                </div>
                {% endif %}

                {% if messages %}
                {% for message in messages %}
                <div class="alert-info">
                    <i class="bi bi-info-circle-fill"></i> {{ message }}
                </div>
                {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="field-group">
                        <label class="login-label">Nom d'utilisateur</label>
                        <div class="input-wrap">
                            <i class="bi bi-person input-icon"></i>
                            <input type="text" name="username" class="login-field" placeholder="Identifiant" autofocus required>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="login-label">Mot de passe</label>
                        <div class="input-wrap">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" name="password" id="loginPwd" class="login-field" placeholder="••••••••" required>
                            <button type="button" class="toggle-pwd" onclick="togglePwd()">
                                <i class="bi bi-eye" id="pwdIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Se connecter</button>
                </form>

            </div>
        </div>

    </div>

    <script>
    function togglePwd() {
        const f = document.getElementById('loginPwd');
        const i = document.getElementById('pwdIcon');
        f.type = f.type === 'password' ? 'text' : 'password';
        i.className = f.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }
    </script>
</body>
</html>
