{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Vérification Commandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            overflow: hidden;
        }

        /* ── Carte principale : pleine page avec marges ── */
        .card {
            display: flex;
            width: calc(100vw - 80px);
            height: calc(100vh - 80px);
            max-width: 1400px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(15,23,42,.15);
        }

        /* ── Panneau gauche : image 50% ── */
        .card-left {
            flex: 1;
            background-image: url("{% static 'core/image_login.jpg' %}");
            background-size: cover;
            background-position: center;
        }

        /* ── Panneau droit : formulaire 50% ── */
        .card-right {
            flex: 0 0 50%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 80px;
        }

        .card-right form,
        .card-right > * { width: 100%; max-width: 380px; }

        .login-title {
            font-size: 2rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -.02em;
            margin-bottom: 8px;
        }

        .login-sub {
            font-size: .9rem;
            color: #94a3b8;
            margin-bottom: 36px;
        }

        .login-label {
            display: block;
            font-size: .68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 14px;
        }

        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: .85rem;
            pointer-events: none;
        }

        .toggle-pwd {
            position: absolute;
            right: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            font-size: .85rem;
            background: none;
            border: none;
            padding: 0;
            transition: color .15s;
        }
        .toggle-pwd:hover { color: #334155; }

        .login-field {
            width: 100%;
            padding: 13px 40px;
            border: 1.5px solid #e2e8f0;
            border-radius: 50px;
            font-size: .85rem;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            transition: border-color .2s, box-shadow .2s, background .15s;
        }
        .login-field:focus {
            border-color: #94a3b8;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(100,116,139,.1);
        }
        .login-field::placeholder { color: #cbd5e1; }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: #0f172a;
            color: #fff;
            font-size: .85rem;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 6px;
            transition: background .2s, transform .15s, box-shadow .2s;
        }
        .btn-login:hover {
            background: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(15,23,42,.18);
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: .78rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- Gauche : image -->
        <div class="card-left"></div>

        <!-- Droite : formulaire -->
        <div class="card-right">

            <div class="login-title">Bonjour,<br>Bienvenue</div>
            <div class="login-sub">Connectez-vous pour accéder à votre espace</div>

            {% if form.errors %}
            <div class="alert-error">
                <i class="bi bi-exclamation-triangle-fill"></i>
                Identifiants incorrects.
            </div>
            {% endif %}

            {% if messages %}
            {% for message in messages %}
            <div class="alert-error" style="background:#f0f9ff;border-color:#bae6fd;color:#0369a1;">
                <i class="bi bi-info-circle"></i> {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <label class="login-label">Nom d'utilisateur</label>
                <div class="input-wrap">
                    <i class="bi bi-person input-icon"></i>
                    <input type="text" name="username" class="login-field" placeholder="Identifiant" autofocus required>
                </div>

                <label class="login-label">Mot de passe</label>
                <div class="input-wrap">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" name="password" id="loginPwd" class="login-field" placeholder="••••••••" required>
                    <button type="button" class="toggle-pwd" onclick="togglePwd()">
                        <i class="bi bi-eye" id="pwdIcon"></i>
                    </button>
                </div>

                <button type="submit" class="btn-login">Se connecter</button>
            </form>

        </div>
    </div>

    <script>
    function togglePwd() {
        const f = document.getElementById('loginPwd');
        const i = document.getElementById('pwdIcon');
        f.type = f.type === 'password' ? 'text' : 'password';
        i.className = f.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }
    </script>
</body>
</html>
