services:

  web:
    build: .
    restart: unless-stopped
    ports:
      - "1212:8000"
    env_file:
      - config.env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - media_data:/app/media
      - cache_data:/app/.cache
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn verification_commande.wsgi:application
             --bind 0.0.0.0:8000
             --workers 2
             --timeout 300
             --access-logfile -
             --error-logfile -"

  # Purge automatique chaque nuit à 03h30
  purge:
    build: .
    restart: unless-stopped
    env_file:
      - config.env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - media_data:/app/media
      - cache_data:/app/.cache
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "while true; do
               sleep 3600;
               python manage.py purge_donnees --mois 2 --no-vacuum-full;
             done"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traitement_n8n
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traitement_n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
  cache_data:
  static_data:
